<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kalender</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<section id="auth-screen" class="auth-screen hidden">
  <div class="auth-card">
    <h1>Die Verdreide</h1>
    <p class="auth-subtitle">syt 2020</p>

    <form id="login-form" class="auth-form">
      <label>Benutzer
        <select name="username" id="username-select" required></select>
      </label>
      <label>Passwort
        <input type="password" name="password" autocomplete="current-password" required />
      </label>
      <p class="error" id="login-error"></p>
      <button type="submit" class="primary-btn">Anmelden</button>
    </form>
  </div>
</section>

<section id="app-screen" class="app-screen hidden">
  <header class="topbar">
    <div class="topbar-nav">
      <button id="prev-month" class="icon-btn" type="button" aria-label="Vorheriger Monat">&#8592;</button>
      <h2 id="month-label"></h2>
      <button id="next-month" class="icon-btn" type="button" aria-label="Nächster Monat">&#8594;</button>
      <button id="today-btn" class="ghost-btn" type="button">Heute</button>
    </div>
    <div class="topbar-actions">
      <button id="new-event-btn" class="primary-btn" type="button">+ Neuer Termin</button>
      <span id="current-user" class="current-user"></span>
      <button id="logout-btn" class="ghost-btn" type="button">Abmelden</button>
    </div>
  </header>

  <div class="weekday-row">
    <div>Mo</div><div>Di</div><div>Mi</div><div>Do</div><div>Fr</div><div>Sa</div><div>So</div>
  </div>
  <div id="calendar-grid" class="calendar-grid"></div>

  <div id="saturdays-view" class="saturdays-view hidden">
    <div id="saturdays-list" class="saturdays-list"></div>
  </div>

  <div id="polls-view" class="polls-view hidden">
    <div class="polls-toolbar">
      <button type="button" id="new-poll-btn" class="primary-btn">+ Neue Umfrage</button>
    </div>
    <div id="polls-list" class="polls-list"></div>
  </div>

  <div id="profile-view" class="profile-view hidden">
    <div class="profile-avatar" id="profile-avatar"></div>
    <p class="profile-name" id="profile-name"></p>
    <button type="button" id="profile-logout-btn" class="ghost-btn">Abmelden</button>
  </div>

  <nav class="bottom-nav" aria-label="Seiten">
    <button type="button" class="bottom-nav-item active" data-tab="calendar" aria-label="Kalender">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
    </button>
    <button type="button" class="bottom-nav-item" data-tab="saturdays" aria-label="Samstage">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
    </button>
    <button type="button" class="bottom-nav-item" data-tab="polls" aria-label="Umfragen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
    </button>
    <button type="button" class="bottom-nav-item" data-tab="profile" aria-label="Profil / Abmelden">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
    </button>
  </nav>
</section>

<div id="day-modal" class="modal-backdrop hidden">
  <div class="modal">
    <h3 id="day-modal-title"></h3>
    <div id="day-events-list" class="day-events-list modal-scroll-area"></div>
    <div class="modal-actions">
      <button type="button" id="day-close-btn" class="ghost-btn">Schließen</button>
      <div class="spacer"></div>
      <button type="button" id="day-add-btn" class="primary-btn">+ Neuer Termin</button>
    </div>
  </div>
</div>

<div id="event-modal" class="modal-backdrop hidden">
  <div class="modal">
    <h3 id="modal-title">Neuer Termin</h3>
    <form id="event-form" class="modal-scroll-area">
      <label>Titel
        <input type="text" name="title" required maxlength="200" />
      </label>
      <label class="checkbox-row">
        <input type="checkbox" name="allDay" />
        Ganztägig
      </label>
      <div class="row">
        <label>Start
          <input type="datetime-local" name="startAt" required />
        </label>
        <label>Ende
          <input type="datetime-local" name="endAt" required />
        </label>
      </div>
      <label>Ort
        <input type="text" name="location" maxlength="200" />
      </label>
      <label>Farbe
        <div class="color-select-row">
          <select name="color" id="color-select" required></select>
          <span id="color-preview" class="color-preview"></span>
        </div>
      </label>
      <label>Beschreibung
        <textarea name="description" rows="3" maxlength="2000"></textarea>
      </label>
      <p class="error" id="event-error"></p>
    </form>
    <div class="modal-actions">
      <button type="button" id="delete-event-btn" class="danger-btn hidden">Löschen</button>
      <div class="spacer"></div>
      <button type="button" id="cancel-event-btn" class="ghost-btn">Abbrechen</button>
      <button type="submit" form="event-form" id="save-event-btn" class="primary-btn">Speichern</button>
    </div>
  </div>
</div>

<div id="poll-create-modal" class="modal-backdrop hidden">
  <div class="modal">
    <h3>Neue Umfrage</h3>
    <form id="poll-create-form" class="modal-scroll-area">
      <label>Titel
        <input type="text" name="title" required maxlength="200" />
      </label>
      <label>Beschreibung
        <textarea name="description" rows="2" maxlength="2000"></textarea>
      </label>
      <label class="checkbox-row">
        <input type="checkbox" name="multiSelect" checked />
        Mehrfachauswahl erlauben
      </label>
      <label>Optionen
        <div id="poll-options-list" class="poll-options-edit-list"></div>
      </label>
      <button type="button" id="add-poll-option-btn" class="ghost-btn">+ Option hinzufügen</button>
      <p class="error" id="poll-create-error"></p>
    </form>
    <div class="modal-actions">
      <div class="spacer"></div>
      <button type="button" id="poll-create-cancel-btn" class="ghost-btn">Abbrechen</button>
      <button type="submit" form="poll-create-form" class="primary-btn">Erstellen</button>
    </div>
  </div>
</div>

<div id="poll-detail-modal" class="modal-backdrop hidden">
  <div class="modal">
    <h3 id="poll-detail-title"></h3>
    <div id="poll-detail-body" class="modal-scroll-area"></div>
    <div class="modal-actions">
      <button type="button" id="poll-delete-btn" class="danger-btn">Löschen</button>
      <div class="spacer"></div>
      <button type="button" id="poll-close-toggle-btn" class="ghost-btn"></button>
      <button type="button" id="poll-detail-close-btn" class="ghost-btn">Schließen</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
